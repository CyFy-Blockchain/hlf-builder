version: "3.7"

volumes:
  peer0.org1.deployment.com:

networks:
  test:
    name: fabric_test_deployment

services:
  peer0.org1.deployment.com:
    container_name: peer0.org1.deployment.com
    image: hyperledger/fabric-peer:latest
    labels:
      service: hyperledger-fabric
    environment:
      - FABRIC_CFG_PATH=/etc/hyperledger/peercfg
      # - FABRIC_LOGGING_SPEC=INFO
      - FABRIC_LOGGING_SPEC=DEBUG
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_PROFILE_ENABLED=false
      - CORE_PEER_TLS_CERT_FILE=/etc/hyperledger/fabric/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/etc/hyperledger/fabric/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/etc/hyperledger/fabric/tls/ca.crt
      # Peer specific variables
      - CORE_PEER_ID=peer0.org1.deployment.com
      - CORE_PEER_ADDRESS=peer0.org1.deployment.com:7153
      - CORE_PEER_LISTENADDRESS=0.0.0.0:7153
      - CORE_PEER_CHAINCODEADDRESS=peer0.org1.deployment.com:7054
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:7054
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.org1.deployment.com:7153
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.org1.deployment.com:7153
      - CORE_PEER_LOCALMSPID=Org1DeploymentMSP
      - CORE_PEER_MSPCONFIGPATH=/etc/hyperledger/fabric/msp
      - CORE_OPERATIONS_LISTENADDRESS=peer0.org1.deployment.com:9446
      - CORE_METRICS_PROVIDER=prometheus
      - CHAINCODE_AS_A_SERVICE_BUILDER_CONFIG={"peername":"peer0org1"}
      - CORE_CHAINCODE_EXECUTETIMEOUT=300s
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock # picked from test-network/fabric-samples/test-network/compose/docker/docker-compose-test-net.yaml
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=fabric_test_deployment # picked from test-network/fabric-samples/test-network/compose/docker/docker-compose-test-net.yaml
    volumes:
      - ./organizations/peerOrganizations/org1.deployment.com/peers/peer0.org1.deployment.com:/etc/hyperledger/fabric
      - peer0.org1.deployment.com:/var/hyperledger/production
      - ./docker/peercfg:/etc/hyperledger/peercfg # picked from test-network/fabric-samples/test-network/compose/docker/docker-compose-test-net.yaml
      # - ${DOCKER_SOCK}:/host/var/run/docker.sock # picked from test-network/fabric-samples/test-network/compose/docker/docker-compose-test-net.yaml
    working_dir: /root
    command: peer node start
    ports:
      - 7153:7153
      - 9446:9446
    networks:
      - test
