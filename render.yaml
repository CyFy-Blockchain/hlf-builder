services:
  - name: fabric-ca-org1
    type: web
    runtime: docker
    repo: https://github.com/your-username/your-repo
    plan: free # Change to "starter" or "standard" if needed
    envVars:
      - key: FABRIC_CA_HOME
        value: /etc/hyperledger/fabric-ca-server
      - key: FABRIC_CA_SERVER_CA_NAME
        value: ca-org1-deployment
      - key: FABRIC_CA_SERVER_TLS_ENABLED
        value: "true"
      - key: FABRIC_CA_SERVER_PORT
        value: "7055"
      - key: FABRIC_CA_SERVER_OPERATIONS_LISTENADDRESS
        value: 0.0.0.0:17055
    envVarGroups: []
    dockerContext: .
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    disk:
      name: fabric-ca-data
      mountPath: /etc/hyperledger/fabric-ca-server
      sizeGB: 1 # Adjust the storage size if needed
    autoDeploy: true
    region: oregon # Change based on your preference
    ports:
      - 7055
      - 17055
